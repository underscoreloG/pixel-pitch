<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixel Pitch</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; height: 100%; background: #0d130d; overflow: hidden; }
      body { font-family: 'Press Start 2P', monospace; color: #f4f4e8; }
      #game { position: fixed; inset: 0; }
      #game canvas { image-rendering: pixelated; }
      #hud { position: fixed; top: 12px; left: 0; right: 0; text-align: center; pointer-events: none; }
      #score { display: inline-block; background: rgba(0, 0, 0, 0.6); padding: 8px 14px; font-size: 14px; }
      #msg { margin-top: 18px; font-size: 24px; white-space: pre-line; line-height: 34px; text-shadow: 3px 3px 0 #000; min-height: 32px; }
      #clock { display: inline-block; background: rgba(0, 0, 0, 0.6); padding: 8px 10px; font-size: 14px; margin-left: 4px; color: #f4d35e; }
      #clock:empty { display: none; }
      kbd { display: inline-block; font-family: inherit; font-size: 7px; line-height: 9px; min-width: 9px; padding: 2px 3px 1px; text-align: center; color: #0d130d; background: #f4f4e8; border-radius: 2px; box-shadow: 0 2px 0 #8c8c78; position: relative; vertical-align: middle; }
      kbd.arr { width: 9px; height: 9px; padding: 2px 3px 1px; }
      kbd.arr::before { content: ''; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); border: 0 solid transparent; }
      kbd.up::before { border-width: 0 3px 4px; border-bottom-color: #0d130d; }
      kbd.down::before { border-width: 4px 3px 0; border-top-color: #0d130d; }
      kbd.left::before { border-width: 3px 4px 3px 0; border-right-color: #0d130d; }
      kbd.right::before { border-width: 3px 0 3px 4px; border-left-color: #0d130d; }
      #help { position: fixed; bottom: 8px; left: 12px; right: 12px; width: fit-content; margin: 0 auto; box-sizing: border-box; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 14px; padding: 7px 12px 6px; background: rgba(0, 0, 0, 0.5); font-size: 7px; line-height: 13px; opacity: 0.85; pointer-events: none; }
      #help[hidden] { display: none; }
      #help span { white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; }
      @media (max-height: 460px) { #radar { width: 112px; height: 73px; } #score, #clock { font-size: 11px; padding: 6px 10px; } }
      #touch { position: fixed; inset: 0; pointer-events: none; touch-action: none; user-select: none; -webkit-user-select: none; }
      #touch[hidden] { display: none; }
      #touch .stick { position: absolute; left: max(16px, env(safe-area-inset-left)); bottom: 20px; width: 128px; height: 128px; border-radius: 50%; background: rgba(0, 0, 0, 0.28); border: 2px solid rgba(244, 244, 232, 0.35); pointer-events: auto; touch-action: none; }
      #touch .knob { position: absolute; left: 39px; top: 39px; width: 50px; height: 50px; border-radius: 50%; background: rgba(244, 244, 232, 0.55); pointer-events: none; }
      #touch .pad { position: absolute; right: max(16px, env(safe-area-inset-right)); bottom: 18px; display: grid; grid-template-columns: repeat(3, 58px); gap: 10px; pointer-events: auto; }
      #touch button { font-family: inherit; font-size: 8px; width: 58px; height: 58px; border-radius: 50%; border: 2px solid rgba(244, 244, 232, 0.45); background: rgba(0, 0, 0, 0.35); color: #f4f4e8; touch-action: none; padding: 0; }
      #touch button.on { background: rgba(244, 211, 94, 0.55); color: #0d130d; }
      #touch .pause { position: absolute; top: 12px; left: 12px; width: 40px; height: 40px; border-radius: 8px; pointer-events: auto; }
      #radar { position: fixed; top: 12px; right: 12px; width: 168px; height: 109px; opacity: 0.85; image-rendering: pixelated; }
      #menu { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(6, 12, 6, 0.62); }
      #menu[hidden] { display: none; }
      #menu .panel { text-align: center; padding: 28px 36px; background: rgba(0, 0, 0, 0.55); border: 3px solid #f4f4e8; box-shadow: 6px 6px 0 #000; }
      #menu h1 { font-size: 30px; margin: 0 0 28px; color: #f4d35e; text-shadow: 4px 4px 0 #b23a2e, 7px 7px 0 #000; letter-spacing: 2px; }
      #menu h2 { font-size: 20px; margin: 0 0 22px; text-shadow: 3px 3px 0 #000; }
      #menu .result { font-size: 16px; margin: -6px 0 22px; color: #f4d35e; }
      #menu ul { list-style: none; margin: 0; padding: 0; display: inline-block; text-align: left; }
      #menu li { font-size: 14px; padding: 8px 12px 8px 30px; cursor: pointer; white-space: pre; position: relative; }
      #menu li.on { color: #f4d35e; }
      #menu li.on::before { content: '\25B6'; position: absolute; left: 6px; }
      #menu li.opt.on::after { content: ' <>'; opacity: 0.6; }
      #menu .hint { font-size: 8px; opacity: 0.6; margin: 22px 0 0; }
      #menu .version { font-size: 8px; opacity: 0.45; margin: 12px 0 0; }
      #menu .keys { display: grid; grid-template-columns: auto auto; gap: 10px 28px; text-align: left; font-size: 9px; line-height: 14px; margin: 0 0 18px; }
      #menu .keys span { white-space: nowrap; display: flex; align-items: center; gap: 6px; }
      #menu .keys kbd { font-size: 8px; }
      #menu .tips { font-size: 8px; line-height: 16px; opacity: 0.75; margin: 0 0 18px; text-align: left; }
      #menu .pens { font-size: 10px; color: #f4f4e8; }
      #menu .stats { border-collapse: collapse; margin: -8px auto 22px; font-size: 9px; }
      #menu .stats td { padding: 4px 10px; text-align: center; }
      #menu .stats td:nth-child(2) { opacity: 0.7; font-size: 8px; }
      #menu .stats td:first-child { color: #f08070; }
      #menu .stats td:last-child { color: #80a8f0; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="hud" hidden><span id="score">RED 0 - 0 BLUE</span><span id="clock"></span><div id="msg"></div></div>
    <canvas id="radar" width="210" height="136" hidden></canvas>
    <div id="menu" hidden></div>
    <div id="help" hidden>
      <span><kbd class="arr left"></kbd><kbd class="arr up"></kbd><kbd class="arr down"></kbd><kbd class="arr right"></kbd> Move</span>
      <span><kbd>S</kbd> Pass</span>
      <span><kbd>D</kbd> Shoot</span>
      <span><kbd>A</kbd> Lob</span>
      <span><kbd>W</kbd> Through</span>
      <span><kbd>E</kbd> Curl</span>
      <span><kbd>SHIFT</kbd> Sprint</span>
      <span><kbd>Q</kbd> Switch</span>
      <span><kbd>ESC</kbd> Pause</span>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
